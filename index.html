<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberGuard — Bullying Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #070b14;
      --surface:  #0d1421;
      --border:   #1a2744;
      --accent:   #00e5ff;
      --danger:   #ff3b6b;
      --safe:     #00e5b0;
      --text:     #c8d8f0;
      --muted:    #4a6080;
      --glow-a:   0 0 20px rgba(0,229,255,.35);
      --glow-d:   0 0 20px rgba(255,59,107,.4);
      --glow-s:   0 0 20px rgba(0,229,176,.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 780px; }
    header { text-align: center; margin-bottom: 52px; }
    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: .68rem;
      letter-spacing: .18em;
      color: var(--accent);
      background: rgba(0,229,255,.07);
      border: 1px solid rgba(0,229,255,.2);
      padding: 5px 16px;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: .95rem;
      font-weight: 300;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .stats {
      display: flex; gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 36px;
    }
    .stat { flex: 1; background: var(--surface); padding: 16px 20px; text-align: center; }
    .stat-val {
      font-family: 'Space Mono', monospace;
      font-size: 1.4rem; font-weight: 700;
      color: var(--accent);
    }
    .stat-label {
      font-size: .72rem; color: var(--muted);
      letter-spacing: .08em; text-transform: uppercase; margin-top: 3px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .card-label {
      font-family: 'Space Mono', monospace;
      font-size: .72rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      background: rgba(0,0,0,.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: .95rem; line-height: 1.6;
      padding: 16px; resize: vertical; min-height: 130px;
      transition: border-color .2s, box-shadow .2s; outline: none;
    }
    textarea:focus { border-color: var(--accent); box-shadow: var(--glow-a); }
    textarea::placeholder { color: var(--muted); }
    .char-count {
      text-align: right; font-size: .75rem;
      color: var(--muted); margin-top: 8px;
      font-family: 'Space Mono', monospace;
    }
    .btn {
      width: 100%; padding: 16px;
      background: var(--accent); color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700; font-size: .9rem;
      letter-spacing: .1em; text-transform: uppercase;
      border: none; border-radius: 8px; cursor: pointer;
      transition: opacity .2s, box-shadow .2s, transform .1s;
      margin-top: 20px;
    }
    .btn:hover  { opacity: .88; box-shadow: var(--glow-a); }
    .btn:active { transform: scale(.99); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .result {
      border-radius: 12px; border: 1px solid;
      padding: 28px 32px; display: none;
      animation: fadeUp .35s ease both;
    }
    .result.show { display: block; }
    .result.safe   { border-color: var(--safe);   background: rgba(0,229,176,.06); box-shadow: var(--glow-s); }
    .result.danger { border-color: var(--danger); background: rgba(255,59,107,.06); box-shadow: var(--glow-d); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-icon { font-size: 2.4rem; margin-bottom: 12px; }
    .result-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
    .result.safe   .result-title { color: var(--safe); }
    .result.danger .result-title { color: var(--danger); }
    .result-sub { font-size: .88rem; color: var(--muted); margin-bottom: 20px; }
    .conf-bar-wrap {
      background: rgba(0,0,0,.3); border-radius: 4px;
      height: 6px; overflow: hidden; margin-bottom: 6px;
    }
    .conf-bar { height: 100%; border-radius: 4px; transition: width .8s cubic-bezier(.16,1,.3,1); }
    .result.safe   .conf-bar { background: var(--safe); }
    .result.danger .conf-bar { background: var(--danger); }
    .conf-label { font-family: 'Space Mono', monospace; font-size: .78rem; color: var(--muted); }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,.3); border-top-color: #000;
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; font-size: .76rem; color: var(--muted); margin-top: 48px; }
    footer a { color: var(--accent); text-decoration: none; }
    .error-msg {
      display: none;
      background: rgba(255,59,107,.08);
      border: 1px solid rgba(255,59,107,.3);
      border-radius: 8px; padding: 14px 18px;
      color: var(--danger); font-size: .88rem; margin-top: 16px;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge">NLP · SVM · TF-IDF</div>
      <h1>Cyber<span>Guard</span></h1>
      <p class="subtitle">
        AI-powered cyberbullying detection using NLP and Support Vector Machine
        trained on 13,147 real social-media posts.
      </p>
    </header>

    <div class="stats">
      <div class="stat"><div class="stat-val">95.08%</div><div class="stat-label">Accuracy</div></div>
      <div class="stat"><div class="stat-val">13,147</div><div class="stat-label">Training posts</div></div>
      <div class="stat"><div class="stat-val">SVM</div><div class="stat-label">Best model</div></div>
      <div class="stat"><div class="stat-val">10K</div><div class="stat-label">TF-IDF features</div></div>
    </div>

    <div class="card">
      <div class="card-label">Input Text</div>
      <textarea id="textInput" placeholder="Paste a social-media post, comment, or message here to analyse it for cyberbullying…" maxlength="1000"></textarea>
      <div class="char-count"><span id="charCount">0</span> / 1000</div>
      <button class="btn" id="analyseBtn" onclick="analyse()">Analyse Text</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="result" id="result">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="conf-bar-wrap">
        <div class="conf-bar" id="confBar" style="width:0%"></div>
      </div>
      <div class="conf-label">Model confidence: <span id="confVal">—</span></div>
    </div>

    <footer>
      Built by <a href="https://github.com/PPRRAATTIIKK" target="_blank">@PPRRAATTIIKK</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/PPRRAATTIIKK/Cyber-Bullying-Prediction" target="_blank">GitHub</a>
    </footer>
  </div>

  <script>
    const input  = document.getElementById('textInput');
    const count  = document.getElementById('charCount');
    const btn    = document.getElementById('analyseBtn');
    const result = document.getElementById('result');
    const errMsg = document.getElementById('errorMsg');

    input.addEventListener('input', () => { count.textContent = input.value.length; });

    async function analyse() {
      const text = input.value.trim();
      if (!text) { showError('Please enter some text first.'); return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Analysing…';
      result.classList.remove('show', 'safe', 'danger');
      errMsg.classList.remove('show');
      try {
        const res  = await fetch('/api/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error');
        showResult(data);
      } catch (e) {
        showError('Could not reach the API. (' + e.message + ')');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Analyse Text';
      }
    }

    function showResult(data) {
      const isBad = data.is_cyberbullying;
      result.className = 'result show ' + (isBad ? 'danger' : 'safe');
      document.getElementById('resultIcon').textContent  = isBad ? '⚠️' : '✅';
      document.getElementById('resultTitle').textContent = data.label;
      document.getElementById('resultSub').textContent   = isBad
        ? 'This text shows patterns associated with cyberbullying behaviour.'
        : 'No cyberbullying patterns were detected in this text.';
      document.getElementById('confVal').textContent = data.confidence + '%';
      setTimeout(() => document.getElementById('confBar').style.width = data.confidence + '%', 50);
    }

    function showError(msg) { errMsg.textContent = msg; errMsg.classList.add('show'); }

    input.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') analyse(); });
  </script>
</body>
</html>

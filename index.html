<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard - Bullying Detector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --primary: #e74c3c;
            --border: #dfe6e9;
            --shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e2937;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --border: #334155;
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.4s;
        }
        
        .container {
            max-width: 720px;
            margin: 40px auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .header {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 35px 30px;
            text-align: center;
            position: relative;
        }
        
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header h1 { font-size: 2.4rem; margin-bottom: 6px; }
        .header p { opacity: 0.95; font-size: 1.15rem; }
        
        .content { padding: 40px; }
        
        .status {
            text-align: center;
            padding: 10px 20px;
            background: rgba(39, 174, 96, 0.1);
            color: #27ae60;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        
        textarea {
            width: 100%;
            height: 160px;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-size: 1.1rem;
            background: var(--bg);
            color: var(--text);
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.15);
        }
        
        .btn {
            margin-top: 20px;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        
        .btn:hover { background: #c0392b; transform: translateY(-2px); }
        
        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.05rem;
            display: none;
            border: 1px solid var(--border);
        }
        
        .success { background: rgba(39, 174, 96, 0.1); color: #27ae60; }
        .danger { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        
        .debug {
            margin-top: 15px;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.05);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
        }
        
        .footer {
            text-align: center;
            padding: 25px;
            color: var(--text-light);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">🌙</button>
            <h1>🛡️ CyberGuard</h1>
            <p>AI Cyber Bullying Detector</p>
        </div>
        
        <div class="content">
            <div class="status" id="status">✅ Model Loaded</div>
            
            <textarea id="inputText" placeholder="Type or paste any comment, message, or post here..."></textarea>
            
            <button class="btn" onclick="analyzeText()">Analyze Text</button>
            
            <div id="result"></div>
        </div>
        
        <div class="footer">
            Powered by Machine Learning • Dark Mode Supported
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '☀️';
            }
        });

        async function analyzeText() {
            const text = document.getElementById('inputText').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!text) {
                resultDiv.className = 'danger';
                resultDiv.innerHTML = '<strong>Please enter some text.</strong>';
                resultDiv.style.display = 'block';
                return;
            }
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<strong>Analyzing...</strong>';
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                
                let html = '';
                
                if (data.prediction === "Bullying") {
                    resultDiv.className = 'danger';
                    html = `<h2>🚨 Cyber Bullying Detected</h2>`;
                } else {
                    resultDiv.className = 'success';
                    html = `<h2>✅ No Bullying Detected</h2>`;
                }
                
                html += `
                    <p><strong>Confidence:</strong> ${data.confidence || 'N/A'}%</p>
                    <p><strong>Raw Probability:</strong> ${data.raw_probability || 'N/A'}</p>
                    <p><strong>Threshold:</strong> ${data.threshold_used || '0.22'}</p>
                    <hr>
                    <small style="opacity:0.7">Cleaned text: "${data.cleaned_text || 'N/A'}"</small>
                `;
                
                resultDiv.innerHTML = html;
                
            } catch (err) {
                resultDiv.className = 'danger';
                resultDiv.innerHTML = `<strong>Error:</strong> ${err.message}`;
            }
        }

        document.getElementById('inputText').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') analyzeText();
        });
    </script>

</html>
